<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="themis-beam" x1="10" y1="18" x2="38" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </linearGradient>
    <linearGradient id="themis-accent" x1="10" y1="12" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Background Dark Squircle with subtle border -->
  <rect width="48" height="48" rx="12" fill="#0C0D0E"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#27272A" stroke-opacity="0.8"/>

  <!-- Themis Precision Balance & Code Glyph -->
  <!-- Top Fulcrum Point -->
  <circle cx="24" cy="13.5" r="2" fill="url(#themis-accent)"/>
  
  <!-- Central Axis / Sword of Themis -->
  <path d="M24 15.5V35" stroke="url(#themis-beam)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Base Pedestal -->
  <path d="M19 35H29" stroke="url(#themis-beam)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Horizontal Balance Beam -->
  <path d="M12 20H36" stroke="url(#themis-beam)" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Scale Pan: Stylized Code Bracket "<" balanced -->
  <path d="M12 20V24.5M8 26C8 28.8 16 28.8 16 26" stroke="#93C5FD" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="27" r="1.5" fill="#60A5FA"/>

  <!-- Right Scale Pan: Stylized Code Bracket ">" balanced -->
  <path d="M36 20V24.5M32 26C32 28.8 40 28.8 40 26" stroke="#C4B5FD" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="36" cy="27" r="1.5" fill="#A78BFA"/>
</svg>
